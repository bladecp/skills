name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Skills, manifests and MCP configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check skills, manifests, MCP files and public hygiene
        run: bash scripts/check-public-tree.sh

      - name: Install the JSON Schema checker
        run: python -m pip install --disable-pip-version-check 'check-jsonschema==0.33.0'

      - name: Validate plugin.json against the Agent Plugins schema
        run: check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugin.json

      - name: Validate mcp.json against the Agent Plugins schema
        run: check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/mcp.schema.json mcp.json
